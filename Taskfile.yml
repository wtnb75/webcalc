# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  LCN2: https://github.com/lcn2/calc/releases/download/v2.17.0.0/calc-2.17.0.0.tar.bz2
  CORIOLINUS: https://github.com/coriolinus/calc/archive/refs/tags/v0.5.0.tar.gz
  BC: https://ftp.gnu.org/gnu/bc/bc-1.08.2.tar.gz
  OCTAVE: https://ftp.gnu.org/gnu/octave/octave-11.1.0.tar.gz
  UID:
    sh: id -u
  GID:
    sh: id -g

tasks:
  default:
    desc: show tasks
    cmds:
      - task -l --sort alphanumeric
    silent: true

  _download:
    internal: true
    requires:
      vars:
        - URL
    vars:
      BASE:
        sh: "basename $(basename {{ .URL }} .tar.bz2) .tar.gz"
      FNAME:
        sh: "basename {{ .URL }}"
    cmds:
      - "[ -f {{ .FNAME }} ] || curl -sLO {{ .URL }}"
      - "[ -d {{ .BASE }} ] || tar xfz {{ .FNAME }}"

  web:install:
    desc: install pnpm dependencies (required before WASM builds)
    dir: web
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install

  build:bc:
    desc: build bc and dc WASM via Emscripten (Docker)
    generates:
      - web/public/wasm/bc-core.js
      - web/public/wasm/bc-core.wasm
      - web/public/wasm/dc-core.js
      - web/public/wasm/dc-core.wasm
    cmds:
      - mkdir -p web/public/wasm
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}/bc-1.08.2:/src/bc:ro" \
          -v "{{.ROOT_DIR}}/wasm/bc:/work" \
          -v "{{.ROOT_DIR}}/web/public/wasm:/out" \
          --user "{{.UID}}:{{.GID}}" \
          -w /work \
          emscripten/emsdk:latest \
          make OUT=/out SRC=/src/bc

  build:calc:
    desc: build calc (Rust) WASM via wasm-pack (Docker)
    cmds:
      - mkdir -p web/public/wasm
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}/calc-0.5.0:/src/calc:ro" \
          -v "{{.ROOT_DIR}}/wasm/calc:/work" \
          -v "{{.ROOT_DIR}}/web/public/wasm:/out" \
          rust:latest \
          sh -c "
            set -e
            cp -r /src/calc /tmp/calc-src
            printf 'fn main() { lalrpop::process_root().unwrap(); }\n' > /tmp/calc-src/build.rs
            mkdir -p /tmp/ws/src
            cp /work/src/lib.rs /tmp/ws/src/
            sed 's|path = \"/src/calc\"|path = \"/tmp/calc-src\"|' /work/Cargo.toml > /tmp/ws/Cargo.toml
            cargo install wasm-pack --root /tmp/wasm-pack-bin
            cd /tmp/ws
            /tmp/wasm-pack-bin/bin/wasm-pack build --target web --out-dir /tmp/pkg
            cp /tmp/pkg/calc_wasm.js /out/calc_wasm.js
            cp /tmp/pkg/calc_wasm_bg.wasm /out/calc_wasm_bg.wasm
            cp /tmp/pkg/calc_wasm.d.ts /out/calc_wasm.d.ts
            chown {{.UID}}:{{.GID}} /out/calc_wasm.js /out/calc_wasm_bg.wasm /out/calc_wasm.d.ts
          "

  build:apcalc:
    desc: build apcalc WASM via Emscripten (Docker)
    cmds:
      - mkdir -p web/public/wasm
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}/calc-2.17.0.0:/src/apcalc:ro" \
          -v "{{.ROOT_DIR}}/wasm/apcalc:/work" \
          -v "{{.ROOT_DIR}}/web/public/wasm:/out" \
          --user "{{.UID}}:{{.GID}}" \
          -w /work \
          emscripten/emsdk:latest \
          make OUT=/out SRC=/src/apcalc

  build:wasm:
    desc: build all WASM modules
    cmds:
      - task: build:bc
      - task: build:calc
      - task: build:apcalc

  build:web:
    desc: build frontend (npm run build → dist/)
    dir: web
    deps: [web:install]
    cmds:
      - pnpm run build

  build:
    desc: build everything (WASM + frontend)
    cmds:
      - task: build:wasm
      - task: build:web

  dev:
    desc: start dev server (requires WASM pre-built)
    dir: web
    deps: [web:install]
    cmds:
      - pnpm run dev

  test:
    desc: run all tests
    dir: web
    deps: [web:install]
    cmds:
      - pnpm run test:coverage

  clean:
    desc: remove build artifacts
    cmds:
      - rm -rf web/public/wasm web/dist

  download:
    desc: download source
    cmds:
      - task: _download
        vars:
          URL: "{{ .LCN2 }}"
      - task: _download
        vars:
          URL: "{{ .CORIOLINUS }}"
      - task: _download
        vars:
          URL: "{{ .BC }}"
      - task: _download
        vars:
          URL: "{{ .OCTAVE }}"

  publish:
    desc: publish to gh-pages
    dir: web/dist
    cmds:
      - rm -rf .git
      - touch .nojekyll
      - git init
      - git checkout -b gh-pages
      - git add -A .
      - git commit -m 'pages'
      - git remote add origin https://github.com/wtnb75/webcalc.git
      - git push -f origin gh-pages
